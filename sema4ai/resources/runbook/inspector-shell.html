<header class="automation-inspector-header">
  <div class="automation-surface-eyebrow">Automation Control Plane <span> / Inspectors</span></div>
  <h1 id="automation-inspector-title">Inspectors</h1>
  <p id="automation-inspector-description">Inspect resources in the selected package.</p>
  <div class="automation-inspector-package-context">
    <span class="codicon codicon-package" aria-hidden="true"></span>
    <strong id="automation-inspector-package"></strong>
    <span id="automation-inspector-kind" class="automation-kind"></span>
    <span id="automation-inspector-path"></span>
  </div>
</header>
<nav class="automation-inspector-tabs" aria-label="Inspector tools" role="tablist">
  <button type="button" role="tab" data-inspector-route="/locators-manager/"><span class="codicon codicon-layers" aria-hidden="true"></span>Locators</button>
  <button type="button" role="tab" data-inspector-route="/web-inspector/"><span class="codicon codicon-globe" aria-hidden="true"></span>Web</button>
  <button type="button" role="tab" data-inspector-route="/windows-inspector/"><span class="codicon codicon-window" aria-hidden="true"></span>Windows</button>
  <button type="button" role="tab" data-inspector-route="/image-inspector/"><span class="codicon codicon-file-media" aria-hidden="true"></span>Image</button>
  <button type="button" role="tab" data-inspector-route="/java-inspector/"><span class="codicon codicon-coffee" aria-hidden="true"></span>Java</button>
</nav>
