# Owned extension bootstrap. RCC creates a new environment for this descriptor;
# existing operator environments and data are never migrated or deleted.
channels:
    - conda-forge

dependencies:
    - python=3.11.10 # https://pyreadiness.org/3.11/
    - openssl=3.6.4 # Explicit pin for security fixes (CVE): https://openssl-library.org/news/vulnerabilities/
    - uv=0.4.17 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.2
    - ruamel.yaml=0.18.10
    - msgspec=0.19.0
    - pip:
          - robocorp-inspector==0.10.3 # https://github.com/robocorp/inspector/blob/master/CHANGELOG.md
          - playwright==1.52.0
          - tree-sitter==0.24.0
          - tree-sitter-yaml==0.7.0
          - actions-http-helper==1.0.3
          - ruff==0.11.11
