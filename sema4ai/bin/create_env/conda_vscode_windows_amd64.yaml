# Owned extension bootstrap. RCC creates a new environment for this descriptor;
# existing operator environments and data are never migrated or deleted.
channels:
    - conda-forge

dependencies:
    - python=3.11.10 # https://pyreadiness.org/3.11/
    - openssl=3.6.4 # Explicit pin for security fixes (CVE): https://openssl-library.org/news/vulnerabilities/
    - uv=0.4.17 # https://github.com/astral-sh/uv/blob/main/CHANGELOG.md
    - pyyaml=6.0.2
    - ruamel.yaml=0.18.10
    - msgspec=0.19.0
    - pywin32=303 # https://github.com/mhammond/pywin32/blob/main/CHANGES.txt
    - pyscreeze==0.1.30 # VSCode Image Inspector dependency
    - python-mss==9.0.1 # VSCode Image Inspector dependency
    - comtypes==1.2.1 # VSCode Windows Inspector dependency
    - psutil==5.9.8 # VSCode Windows Inspector dependency
    - java-access-bridge-wrapper==1.2.0 # VSCode Java Inspector dependency
    - pip:
          - playwright==1.52.0
          - tree-sitter==0.24.0
          - tree-sitter-yaml==0.7.0
          - actions-http-helper==1.0.3
          - ruff==0.11.11
