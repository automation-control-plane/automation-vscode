name: Qualify owned Windows VSIX

on:
  workflow_dispatch:
    inputs:
      candidate_qualification:
        description: 'Qualify the explicitly pinned candidate RCC and Actions Runtime releases'
        type: boolean
        required: false
        default: false
      linux_release_qualification:
        description: 'Qualify the promoted Linux VSIX and published backend toolchain'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - '.github/workflows/qualify-owned-windows.yml'
      - 'sema4ai/**'
      - 'sema4ai-python-ls-core/**'

permissions:
  contents: read

concurrency:
  group: owned-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # This explicit qualification branch must expose candidate acceptance as
      # its PR check, rather than a green production-pin control run.
      CANDIDATE_QUALIFICATION: ${{ inputs.candidate_qualification == true || (github.event_name == 'pull_request' && github.head_ref == 'qualify/rcc-18.19.11-runtime-1.1.1') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Package and qualify exact installed Windows VSIX
        if: env.CANDIDATE_QUALIFICATION != 'true'
        shell: pwsh
        run: |
          python sema4ai/tests/qualify_native_windows.py --state "$env:RUNNER_TEMP\owned-vscode"
      - name: Verify candidate releases and qualify their installed Windows VSIX
        if: env.CANDIDATE_QUALIFICATION == 'true'
        shell: pwsh
        run: |
          python sema4ai/tests/qualify_candidate_native_windows.py --state "$env:RUNNER_TEMP\owned-vscode"
      - name: Retain only sanitized receipts and exact candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-windows-vsix-${{ github.sha }}-${{ env.CANDIDATE_QUALIFICATION == 'true' && 'candidate' || 'pinned' }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/owned-vscode/public/**

  linux-release-vsix:
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) || (github.event_name == 'workflow_dispatch' && inputs.linux_release_qualification == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Use task-owned release caches
        shell: bash
        run: |
          {
            echo "POETRY_CACHE_DIR=$RUNNER_TEMP/poetry-cache"
            echo "POETRY_VIRTUALENVS_PATH=$RUNNER_TEMP/poetry-venvs"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
          } >> "$GITHUB_ENV"
      - name: Install locked extension Python environment
        working-directory: sema4ai
        run: |
          python -m pip install --disable-pip-version-check --no-input poetry
          poetry install --no-interaction
      - name: Package exact Linux VSIX
        id: package
        working-directory: sema4ai
        shell: bash
        run: |
          npm ci
          version="$(node -p "require('./package.json').version")"
          vsix="$RUNNER_TEMP/automation-vscode-${version}-linux-x64.vsix"
          npm run vsce:package -- --target linux-x64 --out "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      - name: Qualify installed Linux VSIX and published backend tools
        working-directory: sema4ai
        run: |
          poetry run python tests/qualify_release_linux.py \
            --state "$RUNNER_TEMP/linux-release-qualification" \
            --vsix "${{ steps.package.outputs.vsix }}"
      - name: Retain exact Linux VSIX and sanitized qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-release-vsix-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/linux-release-qualification/public/**
